<!DOCTYPE html>
<html>
  <head>
    <title>11c</title>
  </head>
  <body>
    <script>

      console.log(arraySwap([1, 20, 22, 24, 5]));
      console.log(arraySwap(['hi', 'hello', 'good']));
      
      function arraySwap(array) {
        lastIndex = array.length - 1;
        firstValue = array[0];
        array[0] = array[lastIndex];
        array[lastIndex] = firstValue;
        return array;
      }
    </script>
  </body>
</html>
