<!DOCTYPE html>
<html>
  <head>
    <title>11h</title>
  </head>
  <body>
    <script>
      const nums = [11, 22, 33];

      console.log(addOne(nums));

      console.log(nums);

      function addOne(array) {
        const newNums = [];

        for (let i = 0; i < array.length; i++) {
            newNums.push(nums[i] + 1);
            
        }
        return newNums;
      }
    </script>
  </body>
