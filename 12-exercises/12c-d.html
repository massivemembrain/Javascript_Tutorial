<!DOCTYPE html>
<html>
  <head>
    <title>12c-d</title>
  </head>
  <body>
    <button  class="js-start-button">Start</button>
    <script>
      const buttonElement = document.querySelector('.js-start-button');
      buttonElement.addEventListener('click', () => {
        const inputElement = document.querySelector('.js-start-button');
        inputElement.innerHTML = 'Loading...';
        setTimeout(() => {   
          inputElement.innerHTML = 'Finished!';
        }, 1000)
      })
    </script>
  </body>
</html>
