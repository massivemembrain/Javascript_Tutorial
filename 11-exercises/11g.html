<!DOCTYPE html>
<html>
  <head>
    <title>11g</title>
  </head>
  <body>
    <script>
      const nums = [11, 22, 33];
      const newNums = [];
      
      for (let i = 0; i < nums.length; i++) {
        newNums.push(nums[i] + 1);
      }

      console.log(nums);
      console.log(newNums);
    </script>
  </body>
</html>
