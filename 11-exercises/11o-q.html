<!DOCTYPE html>
<html>
  <head>
    <title>11o-q</title>

  </head>
  <body>

    <script>
      function findSearchIndex(array) {
        let found = false;
        for (let i = 0; i < array.length; i++) {
          if (array[i] === 'search') {
            console.log(i);
            found = true;
            break;
          }
        }
        if (found === false) {
          console.log(-1);
        }
        
      }
      findSearchIndex(['hello', 'world', 'search', 'good']);
      findSearchIndex(['not', 'found']);
      findSearchIndex(['hello', 'world', 'search', 'good', 'search']);

      
      function findIndex(array, word) {
        for (let i = 0; i < array.length; i++) {
          if (array[i] === word) {
            return i
          }
        }
        return -1
      }

      console.log(findIndex(['green', 'red', 'blue', 'red'], 'red'));
      console.log(findIndex(['green', 'red', 'blue', 'red'], 'yellow'));
      
    </script>
  </body>
</html>
