<!DOCTYPE html>
<html>
  <head>
    <title>11r-u</title>
  </head>
  <body>
    <script>
      
      function removeEgg(foods) {
        counter = 2;
        reverseFoods = foods.slice().reverse();
        newFoods = [];
        
        for (let i = 0; i < foods.length; i++) {
          if (reverseFoods[i] === 'egg' && counter > 0) {
            counter--;
            continue;
          }
          
          newFoods.push(reverseFoods[i]);

        }

        return newFoods.reverse();
      }


      const foods = ['egg', 'apple', 'egg', 'egg', 'ham']
      console.log(removeEgg(foods));
      console.log(foods);

    </script>
  </body>
</html>
