<!DOCTYPE html>
<html>
  <head>
    <title>12c-d</title>
  </head>
  <body>
    <button  onclick="changeToFinished()" class="js-start-button">Start</button>
    <script>
      function changeToFinished() {
        const inputElement = document.querySelector('.js-start-button');
        inputElement.innerHTML = 'Loading...';
        setTimeout(function() {   
          inputElement.innerHTML = 'Finished!';
        }, 1000)
      }
    </script>
  </body>
</html>
