<!DOCTYPE html>
<html>
  <head>
    <title>12l</title>
  </head>

  <body>
    

    <script>
      const countPositive = array => {
        let positives = 0;
        array.forEach((value) => {
          if (value > 0) {
            positives++;
          }
        })
        return positives;
      }

      console.log(countPositive([1, -3, 5]));
      console.log(countPositive([-2, 3, -5, 7, 10]));
    </script>
  </body>
</html>
