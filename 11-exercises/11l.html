<!DOCTYPE html>
<html>
  <head>
    <title>11k</title>
  </head>
  <body>
    <script>
      console.log(minMax([1, -3, 5]));
      console.log(minMax([-2, 3, -5, 7, 10]));
      console.log(minMax([]));
      console.log(minMax([3]));
      
      function minMax(nums) {
        if (nums.length === 0) {
          return {min: null, max: null};
        }
        let min = nums[0];
        let max = nums[0];
        
        for (let i = 0; i < nums.length; i++) {
          if (nums[i] < min || min === null) {
            min = nums[i];
          }
          if (nums[i] > max || max === null) {
            max = nums[i];
          }
        }
        return {min, max};
      }
    </script>
  </body>
</html>
