<!DOCTYPE html>
<html>
  <head>
    <title>12g-i</title>
  </head>
  <body>
    <button class="js-add-button">
      Add
    </button>
    <button class="js-delete-button">
      Delete
    </button>

    <script>

      let messageCount = 2;
      let areMessagesShowing = false;
      function newMessage() {
        if (!areMessagesShowing && messageCount > 0) {
          document.title = `(${messageCount}) New messages`;
          areMessagesShowing = true;
        } else {
          document.title = `App`;
          areMessagesShowing = false;
        }
      }

      document.querySelector('.js-add-button')
        .addEventListener('click', () => {
          messageCount++;
        });

      document.querySelector('.js-delete-button')
        .addEventListener('click', () => {
          if (messageCount > 0) {
            messageCount--;
          }
        });

      setInterval(newMessage, 1000);
    </script>
  </body>
</html>
