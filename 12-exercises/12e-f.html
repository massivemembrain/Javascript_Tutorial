<!DOCTYPE html>
<html>
  <head>
    <title>12e-f</title>
  </head>
  <body>
    
    <button onclick="addToCart()" class="js-add-button">Add to cart</button>
    <div class="js-add">

    </div>
    
    <script>
      let timeOutId;
      function addToCart() {    
        const html = `<p>Added</p>`;
        const innerElement = document.querySelector('.js-add');
        innerElement.innerHTML = html;

        clearTimeout(timeOutId);
        timeOutId = setTimeout(function() {
          innerElement.innerHTML = ``
        }, 2000);
      }
    </script>
  </body>
</html>
